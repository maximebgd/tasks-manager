# Déploiement « tout à puller » : aucun build, aucune source requise sur la machine.
# Les deux images sont récupérées depuis un registre (Docker Hub + GHCR).
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# TAG épingle la version de l'app (défaut : latest) :
#   TAG=1.2.0 docker compose -f docker-compose.prod.yml up -d
#
# Note : le package GHCR étant privé par défaut, un `docker login ghcr.io`
# est nécessaire au préalable (ou rendre le package public sur GitHub).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    # Pas de port exposé en prod : seul `web` (réseau interne) accède à la BDD.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/maximebgd/tasks-manager:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tasks:tasks@db:5432/tasks?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
