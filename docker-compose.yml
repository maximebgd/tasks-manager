services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      # Exposé pour l'outillage local (prisma migrate/studio depuis l'hôte).
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # Mode LOCAL (défaut) : l'image web est CONSTRUITE depuis le Dockerfile et
    # taguée `local/tasks-manager`. La BDD (service `db`) est, elle, toujours pull.
    #   docker compose build        → construit local/tasks-manager:latest
    #   docker compose up           → build local + run (db pull)
    # Pour tirer l'image publiée sur GHCR à la place (aucun build), voir
    # docker-compose.prod.yml.
    # TAG épingle une version : `TAG=1.2.0 docker compose up`.
    image: local/tasks-manager:${TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` = nom du service = hôte réseau interne à Compose.
      DATABASE_URL: postgresql://tasks:tasks@db:5432/tasks?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
