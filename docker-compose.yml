services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Identifiants lus depuis .env (défaut `tasks` si absent).
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    ports:
      # Exposé sur la BOUCLE LOCALE uniquement (prisma migrate/studio depuis
      # l'hôte). Pas de `0.0.0.0` : la BDD n'est jamais joignable depuis le LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # Mode LOCAL (défaut) : l'image web est CONSTRUITE depuis le Dockerfile et
    # taguée `local/tasks-manager`. La BDD (service `db`) est, elle, toujours pull.
    #   docker compose build        → construit local/tasks-manager:latest
    #   docker compose up           → build local + run (db pull)
    # Pour tirer l'image publiée sur GHCR à la place (aucun build), voir
    # docker-compose.prod.yml.
    # TAG épingle une version : `TAG=1.2.0 docker compose up`.
    image: local/tasks-manager:${TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` = nom du service = hôte réseau interne à Compose. URL construite à
      # partir des mêmes POSTGRES_* que le service `db` (source unique = .env).
      DATABASE_URL: postgresql://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD:-tasks}@db:5432/${POSTGRES_DB:-tasks}?schema=public
      NODE_ENV: production
    ports:
      # Boucle locale uniquement : l'app n'a pas d'authentification applicative,
      # on ne l'expose donc pas au réseau. Accès via http://localhost:3000.
      # Pour y accéder depuis d'autres machines du LAN, remplacer par "3000:3000"
      # en connaissance de cause (accès lecture/écriture total, sans barrière).
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
