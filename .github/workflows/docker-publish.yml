name: Build & publish Docker image

# Build l'image de l'app (web) et la pousse sur le GitHub Container Registry (GHCR)
# à chaque push sur `main` et sur chaque tag `v*`. La BDD (Postgres) reste un
# service à part (docker-compose.yml) — on ne publie que l'image applicative.
#
# Image MULTI-ARCH (amd64 + arm64) sans QEMU : chaque architecture est buildée
# sur un runner NATIF (le `npm ci` / `next build` d'arm64 sous émulation QEMU
# plantait — « illegal instruction »). Chaque job pousse son image « par digest »
# (sans tag), puis un job `merge` recombine les digests en une seule référence
# multi-arch taguée (latest, sha, branche, semver).

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Permet de relancer le build à la main depuis l'onglet Actions.
  workflow_dispatch:

env:
  # ghcr.io/<owner>/<repo> — déjà en minuscules ici (maximebgd/tasks-manager).
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # runner ARM natif (gratuit en repo public)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # requis pour pousser sur GHCR
    steps:
      # Ex. "linux/amd64" -> "linux-amd64" pour nommer artefacts et scopes de cache.
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels OCI (les tags sont posés plus tard, sur le manifest final).
      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Cache séparé par arch pour éviter les collisions entre les deux jobs.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # `latest` uniquement sur la branche par défaut (main)
            type=raw,value=latest,enable={{is_default_branch}}
            # nom de branche (ex. main) et sha court, pour tracer chaque build
            type=ref,event=branch
            type=sha,format=short
            # versions sémantiques sur les tags git v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Assemble les digests par arch en un seul manifest multi-arch tagué.
      - name: Create manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
